{% extends "index.html" %}

{% block title %}Login - CyberNews Tracker{% endblock %}

{% block content %}
<section class="contact auth-card">
    <h2>Login</h2>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" autocomplete="username" required>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
    </form>

    <p class="hint">No account yet? <a href="{{ url_for('register') }}">Register</a>.</p>
    <p class="hint">Demo accounts: <code>alice / alicepass</code> (user), <code>bob / bobpass</code> (admin)</p>
</section>
{% endblock %}
