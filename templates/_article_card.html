<article class="card">
    <span class="badge">{{ article.category }}</span>
    <h3><a href="{{ url_for('article', article_id=article.id) }}">{{ article.title }}</a></h3>
    <p>{{ article.summary }}</p>
    <time datetime="{{ article.published }}">{{ article.published }}</time> &middot; <span class="hint">{{ article.source }}</span>
</article>
